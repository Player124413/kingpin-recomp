// Game controller layout (exec'd from autoexec.cfg by tools/install_game.sh).
// The port reports a controller as the game's joystick: X/Y left stick, Z/R right stick,
// U/V triggers. Quake 2 names buttons 1-4 JOY1-JOY4 and button i >= 5 AUX(i): LB = AUX5.
set in_joystick "1"
set joy_advanced "1"
set joy_advaxisx "3"                     // left stick: strafe
set joy_advaxisy "1"                     //             forward/back
set joy_advaxisz "4"                     // right stick: turn
set joy_advaxisr "2"                     //              look up/down
set joy_advaxisu "0"
set joy_advaxisv "0"
set joy_forwardsensitivity "-1"
set joy_sidesensitivity "1"
set joy_yawsensitivity "-0.7"
set joy_pitchsensitivity "0.6"
set joy_forwardthreshold "0.15"
set joy_sidethreshold "0.15"
set joy_yawthreshold "0.12"
set joy_pitchthreshold "0.12"
joy_advancedupdate
+mlook
bind JOY1 "+moveup"                      // A: jump
bind JOY2 "+movedown"                    // B: crouch (puts a note/notebook away when one is up)
bind JOY3 "+activate"                    // X: use / talk
bind JOY4 "reload"                       // Y
bind AUX5 "weapprev"                     // LB
bind AUX6 "weapnext"                     // RB
bind AUX7 "+speed"                       // LT: run
bind AUX8 "+attack"                      // RT: fire
bind AUX9 "flashlight"                   // L3
bind AUX10 "invuse"                      // R3: use the selected item
bind AUX11 "holster"                     // Back / View / Select
bind AUX29 "key1"                        // D-pad up: friendly reply
bind AUX30 "invnext"                     // D-pad right
bind AUX31 "key2"                        // D-pad down: hostile reply
bind AUX32 "invprev"                     // D-pad left
