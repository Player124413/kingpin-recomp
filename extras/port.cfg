// Settings for this port (exec'd from autoexec.cfg by tools/install_game.sh).
set gl_mode "6"                          // video mode 6 = the display's native resolution here
set gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
set gl_maxtexsize "1024"
set gl_shadows "0"                       // the original blob shadows point every which way
set cl_maxfps "125"                      // the frame rate follows the display (up to 120 Hz)
