name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      game_archive_url:
        description: 'ZIP URL (Google Drive / Hugging Face); blank = GAME_ARCHIVE_URL secret'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to "tools platform-tools", but "tools" was removed.
          packages: platform-tools
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unshield ninja-build cmake
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018'
          python -m pip install -r requirements.txt gdown==5.2.0 etcpak==0.9.15 pillow==13.0.0 texture2ddecoder==1.0.6
      - name: Test packaging and ETC2 codec
        run: python -m unittest discover -s tests
      - name: Download and extract your disc
        env:
          GAME_ARCHIVE_URL: ${{ inputs.game_archive_url || secrets.GAME_ARCHIVE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/ci_disc.py
      - name: Install game from disc
        run: |
          cue=$(find disc -type f -iname '*.cue' -print -quit)
          tools/install_game.sh "$cue"
      - name: Prepare ETC2 textures
        run: python tools/make_etc2.py
      - name: Recompile original binaries
        run: |
          python tools/x86recomp.py gen game/kingpin.exe game/ref_gl.dll game/main/gamex86.dll --seeds tools/seeds.txt --overrides tools/overrides.txt
          python tools/x86recomp.py gen_intro game/kpintro.exe --smc tools/kpintro_smc.txt
      - name: Build and verify APK
        env:
          KP_BUNDLE_DATA: '0'
        run: |
          android/build.sh
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify build-android/Kingpin.apk
      - name: Prepare separate game data folder
        run: python tools/bundle_android_data.py --export-directory build-android/game-data
      # These artifacts contain copyrighted material: personal use only, no public releases.
      - uses: actions/upload-artifact@v4
        with:
          name: Kingpin-Android-arm64
          path: build-android/Kingpin.apk
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: Kingpin-Game-Data
          path: build-android/game-data/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Remove game material
        if: always()
        run: rm -rf disc game cd gen gen_intro track1.iso build-android/game-data
